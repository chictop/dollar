<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="달러 스플릿">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#EFF1EC">
<title>달러 세븐 스플릿</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=&apos;http://www.w3.org/2000/svg&apos; viewBox=&apos;0 0 100 100&apos;%3E%3Crect width=&apos;100&apos; height=&apos;100&apos; rx=&apos;20&apos; fill=&apos;%2316212C&apos;/%3E%3Ctext x=&apos;50&apos; y=&apos;68&apos; font-size=&apos;58&apos; text-anchor=&apos;middle&apos; fill=&apos;%23EFF1EC&apos; font-family=&apos;sans-serif&apos; font-weight=&apos;bold&apos;%3E%24%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --paper: #EFF1EC; --surface: #FFFFFF;
    --ink: #16212C; --ink-2: #5A6672; --ink-3: #8C959E;
    --rule: #CDD2C9; --rule-soft: #E2E5DE;
    --buy: #1E6F54; --buy-soft: #E4EFE9;
    --sell: #96670F; --sell-soft: #F6EDDB;
    --wait: #6F7A85; --wait-soft: #E6E9E5;
    --warn: #A0392F;
  }
  html, body { margin: 0; padding: 0; background: var(--paper); -webkit-text-size-adjust: 100%; }
  body { min-height: 100vh; overscroll-behavior-y: contain; }
  #app {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
      Pretendard, "Noto Sans KR", "Malgun Gothic", sans-serif;
    color: var(--ink); background: var(--paper);
    max-width: 560px; margin: 0 auto;
    padding-top: calc(18px + env(safe-area-inset-top));
    padding-bottom: calc(48px + env(safe-area-inset-bottom));
    padding-left: calc(14px + env(safe-area-inset-left));
    padding-right: calc(14px + env(safe-area-inset-right));
    font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  #app * { box-sizing: border-box; }
  .boot { padding: 40px 0; text-align: center; color: var(--ink-3); }

  .masthead { display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 2px solid var(--ink); padding-bottom: 8px; margin-bottom: 16px; }
  .masthead h1 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .masthead span { font-size: 12px; color: var(--ink-3); }

  /* 환율 입력 */
  .rate-card { background: var(--surface); border: 1px solid var(--rule-soft);
    border-radius: 3px; padding: 14px 14px 12px; margin-bottom: 10px; }
  .rate-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .rate-head label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .stamp { font-size: 12px; color: var(--ink-3); text-align: right; }
  .stamp.stale { color: var(--warn); font-weight: 600; }
  .rate-row { display: flex; align-items: baseline; gap: 6px; margin-top: 4px;
    border-bottom: 2px solid var(--ink); }
  .rate-row:focus-within { border-bottom-color: var(--buy); }
  .rate-input { flex: 1; min-width: 0; font-family: inherit; font-variant-numeric: tabular-nums;
    font-size: 36px; font-weight: 700; letter-spacing: -.03em; line-height: 1.15;
    border: none; background: transparent; color: var(--ink); padding: 2px 0 4px;
    text-align: left; width: 100%; border-radius: 0; }
  .rate-input:focus { outline: none; }
  .rate-unit { font-size: 16px; font-weight: 600; color: var(--ink-2); }
  .rate-hint { font-size: 12px; color: var(--ink-3); margin-top: 7px; }

  .gauge { margin-top: 14px; }
  .gauge-track { position: relative; height: 6px; background: var(--rule-soft); border-radius: 3px; }
  .gauge-zone { position: absolute; left: 0; top: 0; bottom: 0; background: var(--buy-soft); border-radius: 3px 0 0 3px; }
  .gauge-mark { position: absolute; top: -5px; width: 2px; height: 16px; background: var(--ink); }
  .gauge-thresh { position: absolute; top: -3px; width: 1px; height: 12px; background: var(--buy); }
  .gauge-ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-3); margin-top: 7px; }
  .gauge-read { font-size: 13px; color: var(--ink-2); margin-top: 2px; }

  .verdict { border-radius: 3px; padding: 14px 16px 13px; }
  .verdict.buy  { background: var(--buy-soft);  border-left: 5px solid var(--buy); }
  .verdict.sell { background: var(--sell-soft); border-left: 5px solid var(--sell); }
  .verdict.wait { background: var(--wait-soft); border-left: 5px solid var(--wait); }
  .verdict-kicker { font-size: 12px; color: var(--ink-2); margin-bottom: 3px; }
  .verdict-line { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.3; }
  .verdict.buy .verdict-line { color: var(--buy); }
  .verdict.sell .verdict-line { color: var(--sell); }
  .verdict-note { font-size: 13px; color: var(--ink-2); margin-top: 5px; }

  .action-row { display: flex; gap: 8px; margin: 10px 0 22px; }
  button { font-family: inherit; font-size: 14px; font-weight: 600; border-radius: 3px;
    padding: 11px 14px; cursor: pointer; border: 1px solid var(--ink);
    background: var(--surface); color: var(--ink); flex: 1; }
  button:focus-visible { outline: 2px solid var(--buy); outline-offset: 2px; }
  button.primary { background: var(--ink); color: var(--paper); }
  button.ghost { border-color: var(--rule); color: var(--ink-2); }
  button:disabled { opacity: .35; cursor: default; }

  .slots { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin-bottom: 8px; }
  .slot { aspect-ratio: 1; border-radius: 2px; display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 600; border: 1px solid var(--rule); color: var(--ink-3); }
  .slot.filled { background: var(--buy); border-color: var(--buy); color: #fff; }
  .slot.ready { background: var(--sell); border-color: var(--sell); color: #fff; }
  .slot.next { border-color: var(--ink); border-style: dashed; color: var(--ink); }

  h2 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 26px 0 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: right; font-weight: 500; color: var(--ink-3); font-size: 11px;
    padding: 0 0 6px; border-bottom: 1px solid var(--rule); }
  th:first-child, td:first-child { text-align: left; }
  td { padding: 9px 0 9px 6px; border-bottom: 1px solid var(--rule-soft); text-align: right; vertical-align: top; }
  td:first-child { padding-left: 0; }
  tr.ready td { background: var(--sell-soft); }
  .no { font-weight: 700; }
  .sub { display: block; font-size: 11px; color: var(--ink-3); font-weight: 400; }
  .pct { font-weight: 700; font-size: 14px; }
  .mini { font-size: 11px; padding: 5px 9px; border-radius: 2px; flex: none;
    border-color: var(--sell); color: var(--sell); font-weight: 600; }
  .mini.plain { border-color: var(--rule); color: var(--ink-3); font-weight: 400; }
  .pos { color: var(--buy); } .neg { color: var(--warn); }

  .summary { background: var(--surface); border: 1px solid var(--rule-soft);
    border-radius: 3px; padding: 4px 14px; margin-top: 10px; }
  .srow { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0;
    border-bottom: 1px solid var(--rule-soft); font-size: 14px; }
  .srow:last-child { border-bottom: none; }
  .srow span:first-child { color: var(--ink-2); }
  .srow b { font-weight: 600; text-align: right; }

  details { border-top: 1px solid var(--rule); margin-top: 26px; }
  details + details { margin-top: 0; }
  summary { padding: 13px 0; font-size: 14px; font-weight: 600; cursor: pointer;
    list-style: none; display: flex; justify-content: space-between; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "펼치기"; font-weight: 400; font-size: 12px; color: var(--ink-3); }
  details[open] summary::after { content: "접기"; }

  .field { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 0; }
  .field label { font-size: 13px; color: var(--ink-2); flex: 1; }
  .field .hint { display: block; font-size: 11px; color: var(--ink-3); }
  .field input { font-family: inherit; font-size: 15px; font-variant-numeric: tabular-nums;
    width: 122px; padding: 8px 10px; text-align: right; border: 1px solid var(--rule);
    border-radius: 3px; background: var(--surface); color: var(--ink); }
  .field input:focus-visible { outline: 2px solid var(--buy); outline-offset: 1px; }
  textarea { width: 100%; height: 110px; font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px; padding: 10px; border: 1px solid var(--rule); border-radius: 3px;
    background: var(--surface); color: var(--ink-2); resize: vertical; }
  .guide { font-size: 13px; color: var(--ink-2); padding: 2px 0 14px; }
  .guide b { color: var(--ink); font-weight: 600; }
  .guide ol { margin: 6px 0 12px; padding-left: 20px; }
  .guide li { margin: 4px 0; }
  .alert { background: #FAEDEB; border-left: 5px solid var(--warn); border-radius: 3px;
    padding: 12px 14px; margin-bottom: 14px; font-size: 13px; color: var(--ink-2); line-height: 1.5; }
  .alert b { color: var(--warn); font-weight: 700; }
  .alert.note { background: var(--wait-soft); border-left-color: var(--wait); }
  .alert.note b { color: var(--ink); }
  .alert-msg { display: block; margin-top: 6px; font-size: 11px; color: var(--ink-3);
    font-family: ui-monospace, Menlo, Consolas, monospace; word-break: break-all; }
  .onboard { background: var(--surface); border: 1px solid var(--rule);
    border-left: 5px solid var(--ink); border-radius: 3px;
    padding: 14px 16px 12px; margin-bottom: 14px; }
  .onboard h3 { font-size: 15px; font-weight: 700; margin: 0 0 6px; }
  .onboard ol { margin: 0 0 8px; padding-left: 18px; font-size: 13px; color: var(--ink-2); }
  .onboard li { margin: 5px 0; }
  .onboard li b, .guide li b { color: var(--ink); font-weight: 600; }
  .onboard p { font-size: 13px; color: var(--ink-2); margin: 0 0 10px; }
  .onboard button { width: 100%; flex: none; }
  .rules { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 4px 0 14px; }
  .rules td { padding: 7px 0; border-bottom: 1px solid var(--rule-soft); text-align: left; vertical-align: top; }
  .rules td:first-child { width: 42%; color: var(--ink); font-weight: 600; padding-right: 12px; }
  .rules td:last-child { color: var(--ink-2); }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2);
    margin: 10px 0 14px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 2px;
    margin-right: 5px; vertical-align: -1px; }
  .empty { font-size: 13px; color: var(--ink-3); padding: 14px 0; }
  .footnote { font-size: 11.5px; color: var(--ink-3); line-height: 1.6;
    margin-top: 26px; border-top: 1px solid var(--rule-soft); padding-top: 12px; }

  @media (max-width: 400px) {
    #app { font-size: 15.5px; }
    .slots { gap: 3px; }
    .field input { width: 108px; }
    .rate-input { font-size: 32px; }
  }
</style>
</head>
<body>
<div id="app"><div class="boot">불러오는 중</div></div>

<script>
(function () {
  var KEY = "dollarsplit:v2";

  var DEFAULTS = {
    settings: { total: 1000000, slots: 7, gapWon: 5, targetPct: 1, entryPos: 30, feePct: 0.1 },
    market: { rate: 0, setAt: null, high52: 1562.5, low52: 1334.3 },
    positions: [], closed: [], seq: 0,
    ui: { guideSeen: false }
  };
  var S = JSON.parse(JSON.stringify(DEFAULTS));
  var root = document.getElementById("app");

  /* ---------- 날짜 (기기 현지 시간 기준) ---------- */
  function pad(x) { x = String(x); return x.length === 1 ? "0" + x : x; }
  function localYmd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function addDays(ymdStr, days) {
    var t = new Date(ymdStr + "T00:00:00Z");
    t.setUTCDate(t.getUTCDate() + days);
    return t.toISOString().slice(0, 10);
  }

  /* ---------- 저장 ---------- */
  var STORE = { mode: "none", msg: "" };

  function hasStore() {
    return typeof window !== "undefined" && window.storage &&
      typeof window.storage.set === "function" && typeof window.storage.get === "function";
  }
  function localOK() {
    try {
      window.localStorage.setItem("__probe", "1");
      window.localStorage.removeItem("__probe");
      return true;
    } catch (e) { return false; }
  }

  // 이전 버전에서 저장한 값도 그대로 읽는다. 자동 환율 관련 항목은 버린다.
  function apply(v) {
    if (!v) return;
    S.settings = Object.assign({}, DEFAULTS.settings, v.settings || {});
    if (!v.settings || v.settings.slots == null) {
      var op = (v.settings && v.settings.slotPct) || 0;
      S.settings.slots = op > 0 ? Math.max(1, Math.round(100 / op)) : 7;
    }
    delete S.settings.slotPct;
    delete S.settings.offsetWon;

    var m = v.market || {};
    S.market = {
      rate: typeof m.rate === "number" ? m.rate : 0,
      setAt: m.setAt || null,
      high52: typeof m.high52 === "number" ? m.high52 : DEFAULTS.market.high52,
      low52: typeof m.low52 === "number" ? m.low52 : DEFAULTS.market.low52
    };
    S.positions = v.positions || []; S.closed = v.closed || []; S.seq = v.seq || 0;
    S.ui = Object.assign({}, DEFAULTS.ui, v.ui || {});
  }

  async function load() {
    if (hasStore()) {
      try {
        var r = await window.storage.get(KEY, false);
        STORE.mode = "claude";
        if (r && r.value) apply(JSON.parse(r.value));
        return;
      } catch (e) {
        var msg = String((e && e.message) || e);
        if (!/not available|disabled|denied/i.test(msg)) { STORE.mode = "claude"; return; }
        STORE.msg = msg;
      }
    }
    if (localOK()) {
      STORE.mode = "local";
      try { var v = window.localStorage.getItem(KEY); if (v) apply(JSON.parse(v)); } catch (e) {}
      return;
    }
    STORE.mode = "none";
  }

  async function save() {
    if (STORE.mode === "claude") {
      try { await window.storage.set(KEY, JSON.stringify(S), false); return; }
      catch (e) {
        STORE.msg = String((e && e.message) || e);
        STORE.mode = localOK() ? "local" : "none";
      }
    }
    if (STORE.mode === "local") {
      try { window.localStorage.setItem(KEY, JSON.stringify(S)); return; }
      catch (e) { STORE.msg = String((e && e.message) || e); STORE.mode = "none"; }
    }
  }

  /* ---------- 계산 ---------- */
  var sane = function (v) { return typeof v === "number" && v > 500 && v < 4000; };
  var n = function (v, d) { d = d || 0; return (isFinite(v) ? v : 0).toLocaleString("ko-KR", { minimumFractionDigits: d, maximumFractionDigits: d }); };
  var nr = function (v) { return (isFinite(v) ? v : 0).toLocaleString("ko-KR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var signed = function (v, d) { return (v >= 0 ? "+" : "") + n(v, d); };
  var cls = function (v) { return v >= 0 ? "pos" : "neg"; };
  var fee = function () { return S.settings.feePct / 100; };
  function hasRate() { return sane(S.market.rate); }
  function maxSlots() { return Math.max(1, Math.round(S.settings.slots || 7)); }
  function slotAmount() { return Math.round(S.settings.total / maxSlots()); }
  function pos52() {
    var span = S.market.high52 - S.market.low52;
    if (span <= 0) return 0;
    return Math.min(100, Math.max(0, (S.market.rate - S.market.low52) / span * 100));
  }
  function targetRate(krw, usd) { return krw * (1 + S.settings.targetPct / 100) / (usd * (1 - fee())); }
  function lowestBuy() { return S.positions.reduce(function (m, p) { return Math.min(m, p.rateBuy); }, Infinity); }
  function readySells() { return hasRate() ? S.positions.filter(function (p) { return S.market.rate >= p.target; }) : []; }
  function evalPos(p) {
    var pnl = p.usd * S.market.rate * (1 - fee()) - p.krw;
    return { pnl: pnl, pct: pnl / p.krw * 100 };
  }

  function stamp() {
    if (!S.market.setAt) return { text: hasRate() ? "예전 값 · 오늘 환율로 바꿔주세요" : "아직 입력 전", stale: true };
    var d = new Date(S.market.setAt);
    var hm = pad(d.getHours()) + ":" + pad(d.getMinutes());
    if (localYmd(d) === localYmd(new Date())) return { text: "오늘 " + hm + " 입력", stale: false };
    return { text: (d.getMonth() + 1) + "월 " + d.getDate() + "일 입력 · 오늘 환율로 바꿔주세요", stale: true };
  }

  function verdict() {
    if (!hasRate()) return { kind: "wait", line: "환율을 입력하세요",
      note: "거래하는 곳(토스뱅크 등) 화면의 달러 환율을 위 칸에 넣으면 판정이 나옵니다." };
    var sells = readySells();
    if (sells.length) return { kind: "sell",
      line: sells.map(function (p) { return p.no + "번"; }).join(", ") + " 매도",
      note: "목표 환율에 도달했습니다. 해당 회차만 정리하고 나머지는 그대로 둡니다." };
    if (S.positions.length >= maxSlots()) return { kind: "wait", line: "매수 대기",
      note: "회차를 모두 소진했습니다. 추가 매수 없이 목표 도달을 기다립니다." };
    if (S.positions.length === 0) {
      var p = pos52();
      if (p <= S.settings.entryPos) return { kind: "buy", line: "1번 매수",
        note: "52주 위치 " + n(p, 1) + "% — 진입 기준 " + S.settings.entryPos + "% 이하입니다." };
      return { kind: "wait", line: "매수 대기",
        note: "52주 위치가 " + n(p, 1) + "%입니다. " + S.settings.entryPos + "% 이하로 내려오면 1번을 시작합니다." };
    }
    var trig = lowestBuy() - S.settings.gapWon;
    if (S.market.rate <= trig) return { kind: "buy", line: (S.positions.length + 1) + "번 매수",
      note: "직전 매수가보다 " + S.settings.gapWon + "원 이상 내렸습니다." };
    return { kind: "wait", line: "매수 대기",
      note: nr(trig) + "원 이하로 내려오면 " + (S.positions.length + 1) + "번을 매수합니다. 지금은 " + nr(S.market.rate - trig) + "원 남았습니다." };
  }

  function totals() {
    var krw = 0, usd = 0;
    S.positions.forEach(function (p) { krw += p.krw; usd += p.usd; });
    var ev = usd * S.market.rate * (1 - fee());
    return { krw: krw, usd: usd, ev: ev, open: ev - krw, openPct: krw > 0 ? (ev - krw) / krw * 100 : 0,
      realized: S.closed.reduce(function (a, c) { return a + c.pnl; }, 0) };
  }

  /* ---------- 동작 ---------- */
  function setRate(txt) {
    var v = parseFloat(String(txt).replace(/[^\d.]/g, ""));
    if (!sane(v)) {
      if (String(txt).trim() !== "") alert("환율을 숫자로 입력하세요. 예: 1389.5");
      render(); return;
    }
    S.market.rate = Math.round(v * 100) / 100;
    S.market.setAt = new Date().toISOString();
    save(); render();
  }
  function buy() {
    if (!hasRate() || S.positions.length >= maxSlots()) return;
    var krw = slotAmount(), usd = krw / (S.market.rate * (1 + fee()));
    S.seq += 1;
    S.positions.push({ id: S.seq, no: S.positions.length + 1, date: localYmd(new Date()),
      rateBuy: S.market.rate, krw: krw, usd: usd, target: targetRate(krw, usd) });
    save(); render();
  }
  function sell(id) {
    if (!hasRate()) { alert("먼저 오늘 환율을 입력하세요."); return; }
    var i = S.positions.findIndex(function (p) { return p.id === id; });
    if (i < 0) return;
    var p = S.positions[i], got = p.usd * S.market.rate * (1 - fee());
    if (S.market.rate < p.target && !confirm(p.no + "번은 아직 목표 환율(" + nr(p.target) + "원) 전입니다. 그래도 " + nr(S.market.rate) + "원 매도로 기록할까요?")) return;
    S.closed.unshift({ no: p.no, dateSell: localYmd(new Date()), rateBuy: p.rateBuy,
      rateSell: S.market.rate, krw: p.krw, pnl: got - p.krw });
    S.positions.splice(i, 1);
    S.positions.forEach(function (q, k) { q.no = k + 1; });
    save(); render();
  }
  function setField(path, value) {
    var v = parseFloat(value); if (!isFinite(v)) return;
    var a = path.split("."); S[a[0]][a[1]] = v;
    if (a[0] === "settings" && (a[1] === "targetPct" || a[1] === "feePct"))
      S.positions.forEach(function (p) { p.target = targetRate(p.krw, p.usd); });

  /* ---------- 백테스트 (붙여넣은 환율로) ---------- */
  var BT = { msg: "", result: null };

  // 네이버 금융·인베스팅 등에서 복사한 표를 관대하게 해석한다
  function parsePasted(txt) {
    var out = [], seen = {};
    txt.split(/\r?\n/).forEach(function (ln) {
      var d = null, rest = ln;
      var m = ln.match(/(\d{4})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/);
      if (m) { d = m[1] + "-" + pad(m[2]) + "-" + pad(m[3]); rest = ln.slice(m.index + m[0].length); }
      else {
        var m2 = ln.match(/(\d{1,2})\s*[\/\-]\s*(\d{1,2})\s*[\/\-]\s*(\d{4})/);
        if (m2) { d = m2[3] + "-" + pad(m2[1]) + "-" + pad(m2[2]); rest = ln.slice(m2.index + m2[0].length); }
      }
      if (!d || seen[d]) return;
      var nums = rest.match(/[\d,]+\.?\d*/g) || [];
      for (var i = 0; i < nums.length; i++) {
        var v = parseFloat(nums[i].replace(/,/g, ""));
        if (sane(v)) { seen[d] = 1; out.push({ d: d, r: v }); break; }
      }
    });
    out.sort(function (a, b) { return a.d < b.d ? -1 : 1; });
    return out;
  }

  // start 이전 데이터는 52주 위치 계산에만 쓴다
  function simulate(series, start, full) {
    var st = S.settings, f = st.feePct / 100;
    var slot = Math.round(st.total / maxSlots());
    var open = [], log = [], realized = 0, days = [];

    for (var i = 0; i < series.length; i++) {
      var day = series[i];
      if (day.d < start) continue;
      days.push(day);

      var lo, hi;
      if (!full) { lo = S.market.low52; hi = S.market.high52; }
      else {
        lo = Infinity; hi = -Infinity;
        for (var k = i; k >= 0; k--) {
          if ((new Date(day.d) - new Date(series[k].d)) / 86400000 > 365) break;
          if (series[k].r < lo) lo = series[k].r;
          if (series[k].r > hi) hi = series[k].r;
        }
      }
      var pos = hi > lo ? Math.min(100, Math.max(0, (day.r - lo) / (hi - lo) * 100)) : 0;

      for (var m = open.length - 1; m >= 0; m--) {
        if (day.r >= open[m].target) {
          var pnl = open[m].usd * day.r * (1 - f) - open[m].krw;
          realized += pnl;
          log.push({ d: day.d, act: "매도", no: open[m].no, rate: day.r, pnl: pnl, pct: pnl / open[m].krw * 100 });
          open.splice(m, 1);
        }
      }

      if (open.length < maxSlots()) {
        var go = open.length === 0 ? pos <= st.entryPos
          : day.r <= open.reduce(function (a, p) { return Math.min(a, p.rateBuy); }, Infinity) - st.gapWon;
        if (go) {
          var usd = slot / (day.r * (1 + f));
          open.push({ no: open.length + 1, rateBuy: day.r, krw: slot, usd: usd,
            target: slot * (1 + st.targetPct / 100) / (usd * (1 - f)) });
          log.push({ d: day.d, act: "매수", no: open.length, rate: day.r, pnl: null });
        }
      }
    }

    var last = series[series.length - 1].r, heldKrw = 0, heldUsd = 0;
    open.forEach(function (p) { heldKrw += p.krw; heldUsd += p.usd; });
    var openPnl = heldUsd * last * (1 - f) - heldKrw;
    return {
      days: days.length, first: days[0], last: series[series.length - 1],
      buys: log.filter(function (x) { return x.act === "매수"; }).length,
      sells: log.filter(function (x) { return x.act === "매도"; }).length,
      realized: realized, openPnl: openPnl, held: open.length,
      total: realized + openPnl, log: log.slice().reverse(), slot: slot, full: full
    };
  }

  function runPasted() {
    var el = document.getElementById("bt-paste");
    if (!el) return;
    var arr = parsePasted(el.value || "");
    if (arr.length < 5) {
      BT.msg = "날짜와 환율을 함께 읽은 줄이 " + arr.length + "개뿐입니다. 날짜가 들어 있는 표 전체를 복사해 주세요.";
      BT.result = null; render(); return;
    }
    var spanDays = (new Date(arr[arr.length - 1].d) - new Date(arr[0].d)) / 86400000;
    var full = spanDays > 400;
    BT.msg = "";
    BT.result = simulate(arr, full ? addDays(arr[0].d, 365) : arr[0].d, full);
    render();
  }

      field("편도 거래비용", "% · 환전 수수료가 없으면 0", "settings.feePct", S.settings.feePct, 0.01) + "</details>";

    h += "<details><summary>52주 기준값</summary>" +
      '<div class="guide">최근 1년 동안의 최고·최저 환율입니다. <b>1번 매수 판정에만</b> 쓰이니 한 달에 한 번 정도 갱신하면 충분합니다.</div>' +
      field("52주 최고", "원", "market.high52", S.market.high52, 0.1) +
      field("52주 최저", "원", "market.low52", S.market.low52, 0.1) + "</details>";

    h += backtestHTML();

    /* 종료 */
    h += "<details><summary>종료한 회차 " + (S.closed.length ? "(" + S.closed.length + ")" : "") + "</summary>";
    if (!S.closed.length) h += '<div class="empty">아직 없습니다.</div>';
    else {
      h += "<table><thead><tr><th>회차</th><th>매수</th><th>매도</th><th>손익</th></tr></thead><tbody>";
      S.closed.forEach(function (c) {
        var cp = c.krw ? c.pnl / c.krw * 100 : 0;
        h += '<tr><td class="no">' + c.no + '<span class="sub">' + c.dateSell + "</span></td><td>" +
          nr(c.rateBuy) + "</td><td>" + nr(c.rateSell) + '</td><td class="' + cls(c.pnl) + '">' +
          signed(c.pnl) + '<span class="sub">' + signed(cp, 2) + "%</span></td></tr>";
      });
      h += "</tbody></table>";
    }
    h += "</details>";

    /* 홈 화면 */
    h += '<details><summary>홈 화면에 추가</summary><div class="guide">' +
      "이 앱 주소를 휴대폰 브라우저에서 연 뒤 아래대로 하면 아이콘으로 바로 열립니다." +
      "<ol><li><b>아이폰(사파리)</b> — 아래쪽 공유 아이콘 → 홈 화면에 추가</li>" +
      "<li><b>안드로이드(크롬)</b> — 오른쪽 위 ⋮ → 홈 화면에 추가</li></ol>" +
      "기록은 이 기기의 브라우저에 저장됩니다. 다른 기기로 옮기려면 백업과 복원을 쓰세요.</div></details>";

    /* 백업 */
    h += '<details><summary>백업과 복원</summary><div class="guide">아래 내용을 메모장에 복사해두면 언제든 되돌릴 수 있습니다.</div>' +
      '<textarea id="io" spellcheck="false">' + JSON.stringify(S) + "</textarea>" +
      '<div class="action-row" style="margin:8px 0 14px"><button class="ghost" id="btn-copy">복사</button>' +
      '<button class="ghost" id="btn-import">붙여넣은 내용으로 복원</button></div></details>';

    h += '<details><summary>기록 초기화</summary><div style="padding:4px 0 12px">' +
      '<button id="btn-reset" style="border-color:var(--warn);color:var(--warn)">전부 지우기</button></div></details>';

    h += '<div class="footnote">판정은 직접 입력한 환율로만 합니다. ' +
      "이 도구는 정해둔 규칙을 대신 계산해줄 뿐 수익을 보장하지 않습니다. 투자 판단과 결과는 본인 책임입니다.</div>";

    root.innerHTML = h;
    bind();
  }

  function bind() {
    var g = function (id) { return document.getElementById(id); };

    var rate = g("rate");
    if (rate) {
      rate.onfocus = function () { var el = this; setTimeout(function () { el.select(); }, 0); };
      rate.onkeydown = function (e) { if (e.key === "Enter") this.blur(); };
      rate.onchange = function () { setRate(this.value); };
    }

    if (g("btn-buy")) g("btn-buy").onclick = buy;
    if (g("btn-reset")) g("btn-reset").onclick = resetAll;
    if (g("btn-guide")) g("btn-guide").onclick = function () { S.ui.guideSeen = true; save(); render(); };
    if (g("btn-manual")) g("btn-manual").onclick = function () {
      if (S.positions.length >= maxSlots()) { alert("회차를 모두 소진했습니다."); return; }
      if (confirm("규칙 판정과 무관하게 " + nr(S.market.rate) + "원으로 한 회차를 기록합니다.")) buy();
    };
    if (g("btn-copy")) g("btn-copy").onclick = function () {
      var el = g("io"); el.select(); el.setSelectionRange(0, 999999);
      try { document.execCommand("copy"); alert("복사했습니다."); }
      catch (e) { alert("길게 눌러 직접 복사해 주세요."); }
    };
    if (g("btn-import")) g("btn-import").onclick = function () { importJSON(g("io").value); };
    if (g("bt-run-paste")) g("bt-run-paste").onclick = runPasted;
    root.querySelectorAll("[data-sell]").forEach(function (el) {
      el.onclick = function () { sell(parseInt(el.getAttribute("data-sell"), 10)); };
    });
    root.querySelectorAll("input[data-path]").forEach(function (el) {
      el.onchange = function () { setField(el.getAttribute("data-path"), el.value); };
    });
  }

  load().then(render);
})();
</script>
</body>
</html>
